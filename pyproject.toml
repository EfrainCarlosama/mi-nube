[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-nube"
version = "0.9.0"
description = "Cliente de escritorio moderno para OneDrive y proyectos de ingeniería."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
]
dependencies = [
    "cryptography>=46,<51",
    "httpx>=0.28,<1",
    "msal>=1.34,<2",
    "packaging>=24,<27",
    "PySide6>=6.8,<7",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.7",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[project.scripts]
mi-nube = "mi_nube.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mi_nube = ["assets/*.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
